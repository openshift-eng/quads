[tool.black]
line-length = 119
target-version = ['py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''
[project]
name = "quads"
version = "v2.2.0"
description = "QUADS automates the future scheduling, end-to-end provisioning and delivery of bare-metal servers and networks."
authors = [{ name = "Your Name", email = "you@example.com" }]
license = { text = "GPLv3" }
readme = "README.md"
requires-python = ">=3.12"
homepage = "https://quads.dev"
repository = "https://github.com/redhat-performance/quads"
keywords = ["oob", "management"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
]
packages = [{ include = "quads", from = "src" }]
dependencies = [
  "alembic>=1.10.3",
  "aiohttp>=3.9.5",
  "decorator>=5.1.1",
  "flask[async]==3.1.1",
  "flask-cors>=3.0.10",
  "flask-httpauth>=4.8.0",
  "flask-login>=0.6.2",
  "flask-mail>=0.9.1",
  "flask-migrate>=4.0.4",
  "flask-principal>=0.4.0",
  "flask-script>=2.0.6",
  "flask-security-too>=4.1.5",
  "gunicorn>=22.0.0",
  "jinja2>=3.1.2",
  "passlib>=1.7.4",
  "pexpect>=4.8.0",
  "psycopg2-binary>=2.9.6",
  "pytz>=2023.3",
  "pyyaml>=6.0",
  "six>=1.16.0",
  "sqlalchemy>=2.0.9",
  "werkzeug==3.1.3",
  "wtforms>=3.0.1",
  "email-validator>=1.3.1",
  "pyjwt >=2.6.0",
  "paramiko >=3.0.0",
  "argcomplete>=3.1.2",
  "requests>=2.31.0",
  "validators >=0.20.0",
  "distlib >=0.2",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project.urls]
"Bug Tracker" = "https://github.com/redhat-performance/quads/issues"
"Source Code" = "https://github.com/redhat-performance/quads"
Documentation = "https://github.com/redhat-performance/quads"

[project.scripts]
quads = "quads.cli.main:main"

[tool.poetry.dependencies]
setuptools = ">=39.0"
